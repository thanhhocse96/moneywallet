    <style>
      :root { color-scheme: dark; }
      html, body { background: #0B0F1A; }
      body { font-family: "Plus Jakarta Sans", Inter, system-ui, sans-serif; }
      .glow { position: absolute; border-radius: 9999px; filter: blur(110px); pointer-events: none; }
      .phone {
        position: relative;
        box-sizing: border-box;
        width: min(390px, 100%);
        aspect-ratio: 390 / 844;
        max-height: 844px;
        border: 10px solid #1a1f2e;
        border-radius: 3rem;
        overflow: hidden;
        background: #F4F6FB;
        box-shadow: 0 30px 60px -18px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.07), 0 0 44px -18px rgba(124, 58, 237, 0.35);
      }
      .phone iframe { width: 100%; height: 100%; border: 0; display: block; background: #F4F6FB; }
      .island {
        position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
        width: 108px; height: 26px; background: #0B0F1A; border-radius: 999px;
        z-index: 10; pointer-events: none;
      }
      .island::after {
        content: ""; position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
        width: 8px; height: 8px; border-radius: 999px; background: #232a3d;
      }
      .lang-toggle{display:inline-flex;gap:4px;padding:4px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05)}
      .lang-toggle button{border:0;border-radius:999px;padding:8px 18px;font:inherit;font-size:13px;font-weight:700;letter-spacing:.02em;color:#cbd5e1;background:transparent;cursor:pointer;transition:background .18s,color .18s}
      .lang-toggle button[aria-pressed="true"]{background:#fff;color:#0B0F1A}
    </style>
  </head>
  <body class="min-h-screen text-white antialiased overflow-x-hidden">

    <!-- studio glows -->
    <div class="fixed inset-0 overflow-hidden" aria-hidden="true">

      <div class="glow bg-indigo-500/10" style="width:640px;height:640px;bottom:-260px;left:38%"></div>
    </div>

    <div class="relative mx-auto max-w-[1800px] px-5 sm:px-8">

        <p class="mt-3 text-slate-400 text-[15px] sm:text-base max-w-2xl mx-auto">Concept giao diện hiện đại — 4 màn hình dựng bằng Tailwind CSS, xem thử trong khung điện thoại</p>
        <p class="mt-3 text-slate-500 text-sm">Cùng một bố cục và số liệu, hai ngôn ngữ thị giác — gạt để so sánh.</p>
        <div class="mt-6 flex justify-center">
          <div class="lang-toggle" role="group" aria-label="Chọn ngôn ngữ thiết kế">
            <button type="button" id="toggle-vibrant" aria-pressed="true">Rực rỡ</button>
            <button type="button" id="toggle-minimal" aria-pressed="false">Tối giản</button>
          </div>
        </div>
      </header>

      <main class="grid grid-cols-1 sm:grid-cols-2 min-[1780px]:grid-cols-4 gap-x-6 gap-y-14 justify-items-center pb-16">

        <figure class="flex flex-col items-center">
          <div class="phone">
            <div class="island"></div>
            <iframe data-screen="transactions" title="Màn hình Transactions — bản redesign"></iframe>
          </div>
          <figcaption class="mt-5 text-center max-w-[390px] px-2">
            <h2 class="font-bold text-lg">Transactions</h2>
            <p class="text-sm text-slate-400 mt-1 leading-relaxed">Header tháng gọn dính trên cùng, 3 island gom theo tuần kèm tổng thu/chi, các dòng ngăn bằng hairline, bottom nav thay menu hamburger.</p>
          </figcaption>
        </figure>

        <figure class="flex flex-col items-center">
          <div class="phone">
            <div class="island"></div>
            <iframe data-screen="new" title="Màn hình New transaction — bản redesign"></iframe>
          </div>
          <figcaption class="mt-5 text-center max-w-[390px] px-2">
            <h2 class="font-bold text-lg">New transaction</h2>
            <p class="text-sm text-slate-400 mt-1 leading-relaxed">Số tiền làm trung tâm, chọn loại Expense/Income/Transfer, chip Recent + danh sách category dạng chữ theo nhóm, nút Save nổi.</p>
          </figcaption>
        </figure>

        <figure class="flex flex-col items-center">
          <div class="phone">
            <div class="island"></div>
            <iframe data-screen="budgets" title="Màn hình Budgets — bản redesign"></iframe>
          </div>
          <figcaption class="mt-5 text-center max-w-[390px] px-2">
            <h2 class="font-bold text-lg">Budgets</h2>
            <p class="text-sm text-slate-400 mt-1 leading-relaxed">Thẻ budget với thanh tiến trình, cảnh báo khi gần vượt, số tiền còn lại nổi bật.</p>
          </figcaption>
        </figure>

        <figure class="flex flex-col items-center">
          <div class="phone">
            <div class="island"></div>
            <iframe data-screen="overview" title="Màn hình Overview — bản redesign"></iframe>
          </div>
          <figcaption class="mt-5 text-center max-w-[390px] px-2">
            <h2 class="font-bold text-lg">Overview</h2>
            <p class="text-sm text-slate-400 mt-1 leading-relaxed">Donut chart SVG động, xếp hạng category kèm thanh %, thẻ insight chi tiêu.</p>
          </figcaption>
        </figure>

      </main>

      <footer class="text-center pb-12">
        <p class="text-[13px] text-slate-500">Concept — số liệu lấy từ ảnh chụp màn hình (Sep/Aug 2026). Light mode, font Plus Jakarta Sans.</p>
      </footer>
    </div>

          + '.cat-on span:last-child{color:#161616}'
          + '.switch{width:48px;height:28px;border-radius:999px;background:#161616;position:relative;flex:none;transition:background .25s;padding:0}'
          + '.switch .knob{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(22,22,22,.22);transition:transform .25s;transform:translateX(20px)}'
          + '.switch.off{background:#E5E5E5}'
          + '.switch.off .knob{transform:translateX(0)}'
          + '.caret{display:inline-block;margin-left:2px;font-weight:300;animation:blink 1.1s steps(1) infinite}'
          + '@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}'
          + '@media (prefers-reduced-motion: reduce){.bar-fill{transition:none}.caret{animation:none}}'
          + '</style></head><body>';

        var SCREEN_TAIL = '<script>'
          + 'document.querySelectorAll("[data-bar]").forEach(function(el){'
          + '  var p=el.getAttribute("data-bar");'
          + '  requestAnimationFrame(function(){requestAnimationFrame(function(){el.style.width=p+"%";});});'
          + '});'
          + 'var segs=document.querySelectorAll(".donut-seg");'
          + 'if(segs.length){var C=2*Math.PI*80,acc=0;'
          + '  segs.forEach(function(s){var p=parseFloat(s.getAttribute("data-pct"))/100;'
          + '    s.style.strokeDasharray="0 "+C.toFixed(1);s.style.strokeDashoffset=(-acc*C).toFixed(1);acc+=p;});'
          + '  requestAnimationFrame(function(){requestAnimationFrame(function(){'
          + '    segs.forEach(function(s,i){var p=parseFloat(s.getAttribute("data-pct"))/100;'
          + '      var len=Math.max(p*C-2.5,0.5);'
          + '      s.style.transition="stroke-dasharray 1s cubic-bezier(.22,.8,.3,1) "+(i*0.06)+"s";'
          + '      s.style.strokeDasharray=len.toFixed(1)+" "+(C-len).toFixed(1);});'
          + '  });});}'
          + 'document.querySelectorAll("[data-chips]").forEach(function(group){'
          + '  var on=group.getAttribute("data-on")||"chip-on";'
          + '  var btns=group.querySelectorAll("[data-chip]");'
          + '  btns.forEach(function(b){b.addEventListener("click",function(){'
          + '    btns.forEach(function(x){x.classList.remove(on);});b.classList.add(on);});});'
          + '});'
          + 'document.querySelectorAll("[data-toggle]").forEach(function(t){'
          + '  t.addEventListener("click",function(){t.classList.toggle("off");'
          + '    t.setAttribute("aria-checked",t.classList.contains("off")?"false":"true");});'
          + '});'
          + '<\/script></body></html>';

        var map = {
          transactions: 'src-transactions',
          new: 'src-new',
          budgets: 'src-budgets',
          overview: 'src-overview'
        };
        var minMap = {
          transactions: 'src-min-transactions',
          new: 'src-min-new',
          budgets: 'src-min-budgets',
          overview: 'src-min-overview'
        };
        var docs = { vibrant: {}, minimal: {} };
        Object.keys(map).forEach(function (key) {
          var src = document.getElementById(map[key]);
          if (src) docs.vibrant[key] = SCREEN_HEAD + src.textContent + SCREEN_TAIL;
          var minSrc = document.getElementById(minMap[key]);
          if (minSrc) docs.minimal[key] = MIN_HEAD + minSrc.textContent + SCREEN_TAIL;
        });

        var frames = Array.prototype.slice.call(document.querySelectorAll('iframe[data-screen]'));
        function applyVariant(variant) {
          frames.forEach(function (frame) {
            var key = frame.getAttribute('data-screen');
            var html = docs[variant] && docs[variant][key];
            if (html) frame.srcdoc = html;
          });
          var vb = document.getElementById('toggle-vibrant');
          var mb = document.getElementById('toggle-minimal');
          if (vb && mb) {
            vb.setAttribute('aria-pressed', variant === 'vibrant' ? 'true' : 'false');
            mb.setAttribute('aria-pressed', variant === 'minimal' ? 'true' : 'false');
          }
        }

        var vibrantBtn = document.getElementById('toggle-vibrant');
        var minimalBtn = document.getElementById('toggle-minimal');
        if (vibrantBtn) vibrantBtn.addEventListener('click', function () { applyVariant('vibrant'); });
        if (minimalBtn) minimalBtn.addEventListener('click', function () { applyVariant('minimal'); });

        applyVariant('vibrant');
      })();
    </script>
  </body>
</html>
